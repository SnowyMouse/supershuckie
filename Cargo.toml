[workspace]
members = [
    "supershuckie-core",
    "supershuckie-pokeabyte-integration",
    "supershuckie-replay-recorder",
    "supershuckie-frontend",
    "supershuckie-frontend-c",
    "melonds-rs",
    "mgba-rs",
    "supershuckie-frontend-webserver"
]

resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89.0"

[workspace.dependencies]
# Keep up-to-date
supershuckie-replay-recorder = { version = "0.4.0", path = "supershuckie-replay-recorder" }
supershuckie-pokeabyte-integration = { version = "0.4.0", path = "supershuckie-pokeabyte-integration" }
supershuckie-frontend-webserver = { version = "0.4.0", path = "supershuckie-frontend-webserver" }
supershuckie-core = { version = "0.4.0", path = "supershuckie-core" }
supershuckie-frontend = { version = "0.4.0", path = "supershuckie-frontend" }
melonds-rs = { version = "0.4.0", path = "melonds-rs" }
mgba-rs = { version = "0.4.0", path = "mgba-rs" }

num_enum = "0.7.5"
tinyvec = { version = "1.10.0", features = ["alloc"], default-features = false }
spin = "0.10.0"
zstd-sys = { version = "2.0.16", default-features = false }
blake3 = "1.8.2"
cc = "1.2.46"
byteorder = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
safeboy = "0.3.0-beta.6"
serde_json = "1.0.145"

[profile.release]
lto = true
opt-level = 3
panic = "abort"
